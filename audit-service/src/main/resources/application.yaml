server.port: 8082
spring:
  application.name: audit-service
  datasource: { url: "jdbc:postgresql://localhost:5432/tender_audit_db", username: tender_audit_user, password: password }
  flyway: { url: "jdbc:postgresql://localhost:5432/tender_audit_db", user: tender_care_user, password: password }
  jpa: { open-in-view: false, hibernate.ddl-auto: update }
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.tender.common
        spring.json.value.default.type: com.tender.common.TaskEvent
        spring.json.use.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8089/.well-known/jwks.json