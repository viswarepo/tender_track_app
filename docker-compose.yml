services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: tender_audit_user, POSTGRES_PASSWORD: password }
    ports: [ "5432:5432" ]
    volumes: [ "./infra/init.sql:/docker-entrypoint-initdb.d/init.sql" ]
  kafka:
    image: apache/kafka:3.8.0
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  mailhog:
    image: mailhog/mailhog
    ports: [ "1025:1025", "8025:8025" ]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin }
    ports: [ "8080:8080" ]
    volumes: [ "./infra/carelane-realm.json:/opt/keycloak/data/import/carelane-realm.json" ]
