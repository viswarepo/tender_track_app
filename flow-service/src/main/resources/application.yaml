server.port: 8087
server.error.include-message: always
spring:
  application.name: flow-service
  datasource:
    # Runtime role: NOT a superuser and not the table owner, so row-level security applies to it
    url: jdbc:postgresql://localhost:5432/tender_flow_db
    username: ${DB_APP_USER:tender_flow_user}
    password: ${DB_APP_PASSWORD:password}
  flyway:
    # Migration role: owns the tables and the security-definer function (needs superuser or BYPASSRLS)
    url: jdbc:postgresql://localhost:5432/tender_flow_db
    user: ${DB_MIGRATION_USER:flow_care_user}
    password: ${DB_MIGRATION_PASSWORD:password}
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"
  jpa:
    open-in-view: false
    hibernate.ddl-auto: update   # Flyway builds the schema; Hibernate must not create tables without row-level security
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: flow-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.tender.common
        spring.json.value.default.type: com.tender.common.TaskEvent
        spring.json.use.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8089/.well-known/jwks.json
